  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"ru\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Метрики выполненных задач БФК<\u002Ftitle>\n<style>\n:root{--accent:#FF3134;--bg:#F4F4F6;--card:#FFFFFF;--line:#E7E8EC;--text:#17181D;--muted:#70737E;--soft:#F8F8FA;--green:#4CAE7E;--greenD:#3E9067;--blue:#2F5FC4;--blueL:#E8F0FE;--dnred:#C0403C;--radius:12px;--shadow:0 1px 2px rgba(23,24,29,.04),0 4px 16px rgba(23,24,29,.05)}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{font-family:\"Golos Text\",\"Helvetica Neue\",Arial,sans-serif;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;position:relative}\na{color:inherit}a:hover{color:var(--blue)}\n.slide{width:1920px;position:absolute;top:0;left:0;transform-origin:0 0;padding:22px 44px 26px}\n.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 0 12px;flex-wrap:wrap}\n.kick{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}\nh1{font-size:25px;font-weight:700;letter-spacing:-.015em;margin-top:4px}\n.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.hint{font-size:11.5px;color:var(--muted);margin-right:4px}\n.btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s}\n.btn:hover{border-color:#d5d7dd;color:var(--text)}\n.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.red:hover{background:#e62528;color:#fff}\n.btn.mini{font-size:10px;font-weight:500;padding:3px 8px;border-radius:6px;background:transparent;border:1px solid transparent;color:#B4B7C0}\n.btn.mini:hover{border-color:var(--line);color:var(--muted);background:var(--card)}\n.grid6{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 16px 13px}\n.blk-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.blk-t{margin-top:5px;font-size:14px;line-height:1.45;min-height:24px;text-wrap:pretty}\n.panel{background:#F2F4F8;border:1px solid #E0E4EB;border-radius:14px;box-shadow:var(--shadow);padding:16px 20px 18px;margin-top:12px}\n.p-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:10px}\n.sec-h{font-size:18px;font-weight:700;letter-spacing:-.01em}\n.chips{display:flex;gap:8px;flex-wrap:wrap}\n.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;min-width:145px}\n.chip-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.chip-v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}\n.chip.hl .chip-v{color:var(--greenD)}\n.plan{display:grid;grid-template-columns:265px 1fr 265px;gap:12px;align-items:stretch}\n.dncard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;gap:14px;align-items:center}\n.dn{--p:100;width:78px;height:78px;border-radius:50%;background:conic-gradient(#B3D4C1 0,#5FA97F calc(var(--p)*1%),#EDEEF2 0);display:grid;place-items:center;flex:none}\n.dn i{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}\n.dn-b{min-width:0;flex:1}\n.dn-t{font-size:13px;font-weight:700;line-height:1.25}\n.dn-rows{margin-top:6px;display:grid;gap:3px}\n.dn-r{display:flex;justify-content:space-between;gap:8px;font-size:12px}\n.dn-r span:first-child{color:var(--muted)}\n.dn-r span:last-child{font-weight:700;font-variant-numeric:tabular-nums}\n.inis{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}\n.ini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}\n.ini-code{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.02em}\n.ini-t{font-size:13px;font-weight:600;line-height:1.3}\n.q{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--card);white-space:nowrap}\n.q.done{background:#E4F2EA;border-color:#CBE4D6;color:#48926F}\n.q.plan{background:var(--blueL);border-color:#C7D7F7;color:var(--blue)}\n.qs{display:flex;flex-wrap:wrap;gap:3px}\n.t-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:12px 0 8px}\n.tl{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:#DFE2E8;border-radius:7px;padding:5px 11px}\n.tnote{font-size:11.5px;color:var(--muted)}\n.twrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}\ntable.t{width:100%;border-collapse:separate;border-spacing:0}\n.t th{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 9px;border-bottom:2px solid var(--text)}\n.t td{font-size:11px;line-height:1.35;padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-wrap:pretty}\n.t .q{font-size:9.5px;padding:1px 7px}\n.t tr:last-child td{border-bottom:none}\n.t td.code{font-weight:700;color:var(--blue);white-space:nowrap}\n.t td.task{font-weight:600}\n[contenteditable]{border-radius:3px}\n[contenteditable]:hover{box-shadow:0 0 0 1px #d5d7dd}\n[contenteditable]:focus{outline:none;box-shadow:0 0 0 2px var(--blue);background:#fff}\n@media print{.tools{display:none}html,body{overflow:visible;height:auto}body{background:#fff}.slide{position:static;transform:none!important;width:auto;padding:0}}\n\n/* ==== АНАЛИТИКА (Клиентские договоры v2) ==== */\n\n:root{--accent:#FF3134;--bg:#F4F4F6;--card:#FFFFFF;--line:#E7E8EC;--text:#17181D;--muted:#70737E;--radius:14px;--shadow:0 1px 2px rgba(23,24,29,.04),0 4px 16px rgba(23,24,29,.05)}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{font-family:\"Golos Text\",\"Helvetica Neue\",Arial,sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}\na{color:inherit}a:hover{color:var(--accent)}\n.page{max-width:1180px;margin:0 auto;padding:0 36px 64px}\n.topbar{padding:30px 0 24px}\n.topbar-title{font-size:26px;font-weight:700;letter-spacing:-0.015em}\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}\n.tabs button{font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 18px;cursor:pointer;transition:all .15s}\n.tabs button:hover{color:var(--text);border-color:#d5d7dd}\n.tabs button.on{background:#17181D;border-color:#17181D;color:#fff}\n.ph{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:60px 28px;text-align:center;color:var(--muted);font-size:15px;margin-top:34px}\n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 0}\n.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}\n.kpi-l{font-size:12.5px;color:var(--muted);font-weight:500}\n.kpi-v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1}\n.kpi-s{font-size:12px;color:var(--muted);margin-top:6px}\n.mbars{display:flex;align-items:flex-end;gap:10px;height:210px;padding-top:10px}\n.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}\n.mbar .bar{width:100%;max-width:52px;background:var(--accent);border-radius:6px 6px 0 0}\n.mbar .n{font-size:12px;font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}\n.mbar .m{font-size:11.5px;color:var(--muted);margin-top:8px}\n@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}\n.section-h{font-size:16px;font-weight:700;margin:34px 0 16px;letter-spacing:-0.01em}\n.viz-note{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;text-wrap:pretty}\n.hm-wrap{overflow-x:auto}\ntable.ch{border-collapse:separate;border-spacing:3px;width:100%}\n.ch th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 4px 6px;text-align:center;vertical-align:bottom}\n.ch thead th span{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:11.5px;line-height:1.25;white-space:normal;max-height:170px}\n.ch th.ch-proc{text-align:left;padding-left:0}\n.ch td{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:8px 4px;border-radius:7px;min-width:34px}\n.ch td.ch-proc{text-align:left;font-size:12.5px;font-weight:500;padding-left:0;white-space:nowrap;background:none}\n.ch td.km-name{white-space:normal;max-width:210px;line-height:1.3;padding-right:10px}\n.ch td.km-name i{font-style:normal;color:var(--muted);font-weight:400}\n.src-note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;text-wrap:pretty}\n.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}\n.seg button{font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 16px;cursor:pointer;transition:all .15s}\n.seg button:hover{color:var(--text);border-color:#d5d7dd}\n.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}\n.seg.seg2{gap:6px;margin-bottom:12px}\n.seg.seg2 button.on{background:#17181D;border-color:#17181D;color:#fff}\n.seg-cap{font-size:12.5px;font-weight:600;color:var(--muted);align-self:center;margin-right:2px}\n.seg button b{font-weight:600;opacity:.55;margin-left:5px}\n.seg-count{font-size:12.5px;color:var(--muted);margin-bottom:14px}\n.seg-count b{color:var(--text)}\n.hrow{display:grid;grid-template-columns:190px 1fr 44px;gap:12px;align-items:center;margin-bottom:8px}\n.hlab{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;white-space:normal;line-height:1.3}\n.htrack{display:flex;gap:2px;height:24px}\n.hseg{border-radius:5px;position:relative;min-width:2px}\n.hseg.e{background:var(--accent)}\n.hseg.p{background:#C9CDD6}\n.hseg.d{background:#17181D}\n.hseg.u{background:#EDEEF2;border:1px solid var(--line)}\n.bval{font-size:11.5px;font-weight:600;text-align:center;color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}\n.hseg.p .bval,.hseg.u .bval{color:var(--text)}\n.htot{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}\n.legend{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:16px;font-size:12.5px;color:var(--muted)}\n.legend span{display:flex;align-items:center;gap:7px}\n.ldot{width:11px;height:11px;border-radius:3px}\n\n#view-analytics{font-size:15px}\nhtml.an,body.an{overflow:auto;height:auto}\n.mt{width:100%;border-collapse:collapse;margin-top:6px}\n.mt th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--text)}\n.mt td{font-size:13px;line-height:1.45;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-wrap:pretty}\n.mt tr:last-child td{border-bottom:none}\n.mt td:first-child{font-weight:600}\n\nhtml,body{overflow:auto;height:auto}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"view-analytics\">\n<div class=\"page\">\n  <div class=\"topbar\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n      <h1 class=\"topbar-title\">Метрики выполненных задач БФК<\u002Fh1>\n      <div class=\"tools\"><span class=\"hint\">Кликните на любой текст, чтобы изменить его<\u002Fspan><button class=\"btn mini\" onclick=\"dlHTML()\" title=\"Скачать HTML с правками\">↓<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tabs\" id=\"tabs\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"view\" id=\"v-contracts\">\n  <div class=\"kpis\">\n    <div class=\"kpi\"><div class=\"kpi-l\">Стоимость 1 бумажного договора<\u002Fdiv><div class=\"kpi-v\">0 ₽<\u002Fdiv><div class=\"kpi-s\">обработка и хранение<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi\"><div class=\"kpi-l\">Стоимость 1 электронного договора<\u002Fdiv><div class=\"kpi-v\">0 ₽<\u002Fdiv><div class=\"kpi-s\">обработка и хранение<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi\"><div class=\"kpi-l\">Всего договоров<\u002Fdiv><div class=\"kpi-v\">379<\u002Fdiv><div class=\"kpi-s\">145 на бумаге · 177 электронно<\u002Fdiv><\u002Fdiv>\n    <div class=\"kpi\"><div class=\"kpi-l\">Сэкономлено операционных затрат<\u002Fdiv><div class=\"kpi-v\">0 ₽<\u002Fdiv><div class=\"kpi-s\">разница в стоимости × электронные договоры<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <h2 class=\"section-h\">Договоры по продуктам<\u002Fh2>\n  <div class=\"card\">\n    <div class=\"legend\"><span><i class=\"ldot\" style=\"background:var(--accent)\"><\u002Fi>Электронно<\u002Fspan><span><i class=\"ldot\" style=\"background:#C9CDD6\"><\u002Fi>На бумаге<\u002Fspan><\u002Fdiv>\n    <div class=\"seg seg2\" id=\"barComp\"><\u002Fdiv>\n    <div id=\"chBars\"><\u002Fdiv>\n    <p class=\"src-note\">Строка = продукт × компания (contract_type_description + company; без компании — только код продукта), с разбивкой по каналу поступления: Электронный, В бумажном виде, Диадок (is_diadoc_contract = t), Неопределено — канал в выгрузке не указан (договор ещё не дошёл до согласования). Справа — всего договоров; внутри сегментов — штук по каналу.<\u002Fp>\n  <\u002Fdiv>\n  <h2 class=\"section-h\">Ключевые показатели × продукт и компания<\u002Fh2>\n  <div class=\"card\">\n    <div class=\"seg seg2\" id=\"kmComp\"><\u002Fdiv>\n    <div class=\"seg\" id=\"seg\"><\u002Fdiv>\n    <div class=\"seg-count\" id=\"segCount\"><\u002Fdiv>\n    <p class=\"viz-note\">Столбец = продукт × компания · строка = ключевой показатель. У каждого показателя своя единица измерения, поэтому интенсивность заливки нормирована в пределах строки — ярче всего максимум показателя; прочерк — в сегменте нет таких договоров или данных.<\u002Fp>\n    <div class=\"hm-wrap\" id=\"kmHeat\"><\u002Fdiv>\n    <p class=\"src-note\">Источник: обезличенная выгрузка, лист client_contracts (379 договоров); столбец — contract_type_description (П_КОД_1–17) + company, сортировка по коду продукта, затем по компании. Сегменты: типовой/нетиповой — is_standard_contract; канал — receipt_channel; договоры с is_diadoc_contract = t выделены в «Типовой/Нетиповой из диадока» независимо от канала; «Неопределено» — канал не указан. «Принятых решений на пути согласования» — этапы с зафиксированным решением (Согласовано, Подписано, На доработку и т.д.); «Количество сотрудников» — участники листа согласования (этапы «Согласование…» 1-го круга; выгрузка обезличена, поэтому считаются участники, а не уникальные ФИО); «Дней согласования» — rec_total_duration (среднее по договорам с завершённым этапом); «Количество согласований» — все этапы «Согласование…» по всем кругам; «Дней на подписание» — stage_signature_duration, среднее по договорам с зафиксированным этапом подписания (нулевая длительность показана прочерком); «Кругов согласования» — reconciliation_cycles_count. В сегментах и продуктах с 1–5 договорами значения показательны условно.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"view\" id=\"v-kbd\" style=\"display:none\">\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"kpi-l\">Стоимость 1 бумажного документа<\u002Fdiv><div class=\"kpi-v\">0 ₽<\u002Fdiv><div clas
